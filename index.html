<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>SlabSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111318;
  --paper:#efe8d8;
  --red:#e53238;
  --blue:#0064d3;
  --yellow:#f4ae01;
  --green:#88b719;
  --mut:#5a5d63;
  --hair:#ddd6c2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 'Public Sans',system-ui,sans-serif}

/* ---------- header band ---------- */
.top{background:var(--ink);color:#fff;padding:18px 20px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;max-width:1120px;margin:0 auto;padding-bottom:14px;gap:12px}
.mark{font:400 24px/1 'Anton',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.stamp{font:600 10px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#9aa0aa;white-space:nowrap}
.stripe{display:flex;height:6px;max-width:1120px;margin:0 auto}
.stripe i{flex:1;display:block}

/* ---------- tabs ---------- */
.tabs{display:flex;max-width:1120px;margin:0 auto}
.tab{
  flex:1;border:none;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
  background:#fff;color:var(--ink);cursor:pointer;padding:14px 8px;
  font:700 12px/1 'Public Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:.1s;
}
.tab:last-child{border-right:none}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-4px}

/* ---------- filters ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center;
  max-width:1120px;margin:0 auto;padding:14px 20px;border-bottom:3px solid var(--ink);
}
.filters label{
  display:flex;align-items:center;gap:8px;
  font:600 10px/1 'IBM Plex Mono',ui-monospace,monospace;text-transform:uppercase;
  letter-spacing:.05em;color:var(--mut);
}
.filters select{
  font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;border:2px solid var(--ink);
  background:#fff;color:var(--ink);padding:6px 8px;text-transform:uppercase;
}
.filters input[type=range]{width:120px;accent-color:var(--ink)}
.filters .val{color:var(--ink);min-width:36px}

/* ---------- grid ---------- */
main{max-width:1120px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}

.card{
  position:relative;border:3px solid var(--ink);background:#fff;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(6px);animation:seat .3s ease forwards;
}
@keyframes seat{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}}

.thumb{
  aspect-ratio:1/1;border-bottom:3px solid var(--ink);background:#f1efe4;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:12px;
}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .noimg{font:400 26px 'Anton',sans-serif;color:#c7c4bb}

.rk{
  position:absolute;top:-3px;left:-3px;width:36px;height:36px;
  border:3px solid var(--ink);border-top:none;border-left:none;
  display:flex;align-items:center;justify-content:center;
  font:400 15px/1 'Anton',sans-serif;
}

.cb{padding:12px 13px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.cb h3{
  font:700 12.5px/1.35 'Public Sans',sans-serif;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;
}

.metric{display:flex;align-items:baseline;gap:6px}
.n{font:400 32px/1 'Anton',sans-serif;letter-spacing:.01em}
.u{font:700 9.5px/1 'IBM Plex Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}

.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill2{font:600 10px/1 'IBM Plex Mono',ui-monospace,monospace;border:2px solid var(--ink);padding:4px 6px;color:var(--ink)}

.row2{display:flex;align-items:center;margin-top:auto;padding-top:9px;border-top:2px solid var(--ink)}
.pill{font:700 9.5px/1 'IBM Plex Mono',ui-monospace,monospace;text-transform:uppercase;padding:4px 7px;letter-spacing:.05em;border:2px solid var(--ink)}

.card a.hit{position:absolute;inset:0;z-index:1}
.card:focus-within{outline:3px solid var(--blue);outline-offset:2px}

.empty{grid-column:1/-1;border:3px dashed var(--ink);padding:52px 20px;text-align:center}
.empty h3{font:400 22px/1.2 'Anton',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin-bottom:9px}
.empty p{color:var(--mut);font:500 12.5px/1.6 'Public Sans',sans-serif;max-width:46ch;margin:0 auto}
.empty code{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;background:var(--hair);padding:2px 5px;border:1px solid var(--ink)}
</style>
</head>

const list = document.getElementById('list');
let section = 'bids';
let filters = { sport: 'all', minMetric: 0, minPrice: 0 };

const EMPTY = {
  watched: `<h3>Nothing yet</h3><p>No tracked-seller listings with watchers found.<br>
    Run <code>discover --tracked</code>, then <code>snapshot</code>, then <code>dashboard</code>.</p>`,
  bids: `<h3>Nothing yet</h3><p>No tracked-seller auctions with bids found.<br>
    Run <code>discover --tracked</code>, then <code>snapshot</code>, then <code>dashboard</code>.</p>`,
  heat: `<h3>Nothing trending</h3><p>Nothing has jumped +10 viewers in the last 24h.<br>
    Needs at least two snapshots roughly a day apart.</p>`,
  ending: `<h3>Nothing ending soon</h3><p>No tracked-seller auctions closing in the next 3 hours.</p>`,
};

function metricKeyFor(sec){
  if(sec === 'watched') return 'watchers';
  if(sec === 'heat')    return 'dv';
  return 'bids';
}
function metricLabelFor(sec){
  if(sec === 'watched') return 'Min Watchers';
  if(sec === 'heat')    return 'Min Views/24h';
  return 'Min Bids';
}

const ago = iso => {
  if(!iso) return '';
  const m = Math.max(0, (Date.now() - new Date(iso)) / 6e4);
  return m < 60 ? Math.round(m)+'m ago' : m < 1440 ? Math.round(m/60)+'h ago' : Math.round(m/1440)+'d ago';
};
const till = iso => {
  if(!iso) return null;
  const m = (new Date(iso) - Date.now()) / 6e4;
  if(m < 0) return null;
  return m < 60 ? Math.round(m)+'m' : m < 1440 ? Math.round(m/60)+'h' : Math.round(m/1440)+'d';
};

function tier(grade){
  if(grade >= 8) return {bg:'var(--red)', fg:'#fff'};
  if(grade >= 5) return {bg:'var(--yellow)', fg:'var(--ink)'};
  return {bg:'var(--blue)', fg:'#fff'};
}
function metricFor(d){
  if(section === 'watched') return {v: d.watchers, u: 'watchers'};
  if(section === 'bids')    return {v: d.bids, u: 'bids'};
  if(section === 'ending')  return {v: till(d.ends) || '—', u: 'time left'};
  return {v: '+'+d.dv, u: 'views / 24h'};
}
function pillsFor(d){
  const out = [];
  if(section === 'heat' && d.watchers) out.push('watchers ' + d.watchers);
  if(section === 'watched' && d.bids)  out.push('bids ' + d.bids);
  if(section === 'ending') {
    if(d.watchers) out.push('watchers ' + d.watchers);
    if(d.bids)     out.push('bids ' + d.bids);
  }
  if(d.sport) out.push(d.sport);
  if(d.price) out.push((d.auction ? 'current bid $' : 'ask $') + Number(d.price).toLocaleString());
  return out;
}
function tagFor(d, end, soon){
  if(soon)      return {bg:'var(--red)',  fg:'#fff', text: end+' LEFT'};
  if(d.auction) return {bg:'var(--blue)', fg:'#fff', text: end ? end+' LEFT' : 'AUCTION'};
  return          {bg:'var(--green)',   fg:'#fff', text:'BUY IT NOW'};
}

function buildFilterBar(allRows){
  const mKey = metricKeyFor(section);
  const maxMetric = Math.max(0, ...allRows.map(d => d[mKey] || 0));
  const maxPrice = Math.ceil(Math.max(0, ...allRows.map(d => d.price || 0)));
  const sports = [...new Set(allRows.map(d => d.sport).filter(Boolean))].sort();

  const sportSelect = document.getElementById('sportSelect');
  sportSelect.innerHTML = '<option value="all">All Sports</option>' +
    sports.map(s => `<option value="${s}">${s}</option>`).join('');
  sportSelect.value = sports.includes(filters.sport) ? filters.sport : 'all';
  filters.sport = sportSelect.value;

  document.getElementById('metricLabel').textContent = metricLabelFor(section);
  const metricSlider = document.getElementById('metricSlider');
  metricSlider.max = maxMetric;
  filters.minMetric = Math.min(filters.minMetric, maxMetric);
  metricSlider.value = filters.minMetric;
  document.getElementById('metricVal').textContent = filters.minMetric;

  const priceSlider = document.getElementById('priceSlider');
  priceSlider.max = maxPrice;
  filters.minPrice = Math.min(filters.minPrice, maxPrice);
  priceSlider.value = filters.minPrice;
  document.getElementById('priceVal').textContent = '$' + filters.minPrice;
}

function applyFilters(allRows){
  const mKey = metricKeyFor(section);
  return allRows.filter(d =>
    (filters.sport === 'all' || d.sport === filters.sport) &&
    (d[mKey] || 0) >= filters.minMetric &&
    (d.price || 0) >= filters.minPrice);
}

function paint(){
  const allRows = DATA[section] || [];
  buildFilterBar(allRows);
  const rows = applyFilters(allRows);

  if(!rows.length){
    list.innerHTML = `<div class="empty">${allRows.length ? '<h3>No matches</h3><p>Nothing in this section matches the current filters.</p>' : EMPTY[section]}</div>`;
    return;
  }

  list.innerHTML = rows.map((d,i) => {
    const end = till(d.ends);
    const soon = d.auction && end && (new Date(d.ends)-Date.now())/36e5 < 6;
    const m = metricFor(d);
    const pills = pillsFor(d);
    const rk = tier(d.grade);
    const tag = tagFor(d, end, soon);
    return `<article class="card" style="animation-delay:${Math.min(i,14)*22}ms">
      <a class="hit" href="${d.url}" target="_blank" rel="noopener"
         aria-label="${(d.title||'').replace(/"/g,'&quot;')}"></a>
      <div class="thumb">
        ${d.img ? `<img src="${d.img}" alt="" loading="lazy">` : `<div class="noimg">?</div>`}
      </div>
      <div class="rk" style="background:${rk.bg};color:${rk.fg}">${i+1}</div>
      <div class="cb">
        <h3>${d.title||'Untitled lot'}</h3>
        <div class="metric"><span class="n">${m.v}</span><span class="u">${m.u}</span></div>
        ${pills.length ? `<div class="pills">${pills.map(p=>`<span class="pill2">${p}</span>`).join('')}</div>` : ''}
        <div class="row2">
          <span class="pill" style="background:${tag.bg};color:${tag.fg}">${tag.text}</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(c => c.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true');
  section = c.dataset.s;
  filters = { sport: 'all', minMetric: 0, minPrice: 0 };
  paint();
});

document.getElementById('sportSelect').addEventListener('change', e => {
  filters.sport = e.target.value;
  paint();
});
document.getElementById('metricSlider').addEventListener('input', e => {
  filters.minMetric = +e.target.value;
  paint();
});
document.getElementById('priceSlider').addEventListener('input', e => {
  filters.minPrice = +e.target.value;
  paint();
});

document.getElementById('stamp').textContent = 'updated ' + ago(DATA.generated);

paint();
</script>
</body>
</html>
